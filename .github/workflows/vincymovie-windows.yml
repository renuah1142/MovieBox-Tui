name: Build Vincymovie for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          target: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Vincymovie
        run: cargo build --release --bin vincymovie

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\vincymovie.exe dist\Vincymovie.exe
          Copy-Item README.md dist\README.md
          Copy-Item vincymovie-install.ps1 dist\install.ps1
          Compress-Archive -Path dist\Vincymovie.exe,dist\README.md,dist\install.ps1 -DestinationPath Vincymovie_Windows_x64.zip -Force
          (Get-FileHash Vincymovie_Windows_x64.zip -Algorithm SHA256).Hash | Out-File Vincymovie_Windows_x64.sha256 -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vincymovie-Windows-x64
          path: |
            Vincymovie_Windows_x64.zip
            Vincymovie_Windows_x64.sha256

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "vincymovie-build"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag Vincymovie_Windows_x64.zip Vincymovie_Windows_x64.sha256 --title "Vincymovie Windows build" --notes "Latest Windows build of Vincymovie."
          } else {
            gh release upload $tag Vincymovie_Windows_x64.zip Vincymovie_Windows_x64.sha256 --clobber
          }

      # The distribution must not disappear because an integration test needs
      # network access or a live provider changes.  Keep the suite visible in
      # Actions, but run it after the release has been packaged and published.
      - name: Run integration tests (non-blocking)
        continue-on-error: true
        run: cargo test --all-targets
